function go(i){tab=i;render();window.scrollTo(0,0)}
function mkStep(){const k=S.mk;let n=Math.min(40,Math.floor((Date.now()-k.t)/30000));if(n<1)return 0;k.t=Date.now();
 while(n--)k.x=k.x.map(x=>{let y=x+(1-x)*.12+(Math.random()-.5)*.22;const r=Math.random();if(r<.03)y=1.7+Math.random()*.3;else if(r<.06)y=.5+Math.random()*.1;return Math.min(2,Math.max(.45,y))});return 1}
const news=()=>{const u=[],d=[];S.mk.x.forEach((x,i)=>{if(x>=1.4)u.push(PL[i][0]+" ×"+x.toFixed(1));else if(x<=.7)d.push(PL[i][0]+" ×"+x.toFixed(1))});return`<div class="news">${u.length?`<div>🔥 Высокий спрос: ${u.join(" ")}</div>`:""}${d.length?`<div>📉 Цены упали: ${d.join(" ")}</div>`:""}${u.length||d.length?"":"<div>📊 Цены держатся около нормы</div>"}</div>`};
function tick(){if(mkStep()){save();if((tab==2||tab==0)&&!$("ov").classList.contains("on"))render()}const now=Date.now();S.plots.forEach(pl=>adv(pl,now));
 if(tab==0&&!$("ov").classList.contains("on")){if(sg()!=SG)render();else S.plots.forEach((pl,i)=>{if(pl.p==null||kind(pl)=="r")return;const b=tm(pl.p),e=$("e"+i);if(!e)return;$("b"+i).style.width=pl.g/b*100+"%";$("t"+i).textContent=PL[pl.p][1]+" · "+dur(Math.ceil((b-pl.g)/rate(pl)/1000));e.style.fontSize=esz(pl,pl.g/b)+"px"})}
 if(now-sv>4000){save();sv=now}}
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".zoom .card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*20}deg) rotateX(${-y*20}deg)`});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".zoom .card");if(c)c.style.transform=""});
const away=S.plots.filter(pl=>{adv(pl,Date.now());return kind(pl)=="r"}).length;
const FB_URL="https://sadchudes-4af90-default-rtdb.firebaseio.com";let FBU=(FB_URL||localStorage.getItem("fbu")||"").replace(/\/$/,""),DB=0,OF=[],trg=null,trw="";
if(!S.uid){S.uid="u"+Math.random().toString(36).slice(2,10);save()}const ME=S.uid;
const api=(p,m,b)=>fetch(FBU+"/"+p+".json",{method:m||"GET",body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw 0;return r.json()});
async function pull(){if(!FBU)return;try{const d=await api("offers")||{};OF=Object.keys(d).map(id=>({id,...d[id]}));DB=1;settle();const x=document.activeElement;if(tab==5&&!$("ov").classList.contains("on")&&!(x&&x.tagName=="INPUT"))render()}catch(e){if(DB){DB=0;if(tab==5)render()}}}
function setFB(){const v=$("fbi").value.trim();if(!/^https:\/\/.+/.test(v))return toast("Вставь ссылку на базу, она начинается с https://");FBU=v.replace(/\/$/,"");try{localStorage.setItem("fbu",FBU)}catch(e){}pull().then(()=>{if(!DB)toast("Не удалось подключиться, проверь ссылку");render()})}
function settle(){OF.filter(o=>o.from==ME&&o.status=="done"&&!S.tr[o.id]).forEach(o=>{S.tr[o.id]=1;const t=give(o.want);save();toast("Твой обмен принят! Получена №"+o.want+(t=="NEW"?" 🆕":""));api("offers/"+o.id,"DELETE").catch(()=>{})})}
const cn=n=>`<b style="color:${RC[rar(n)]}">№${n}</b> ${nw(n)}`;
function tradeH(){
 if(!FBU)return`<div class="emp"><div>🤝</div>Подключи обмен<small>Вставь ссылку на базу Firebase, один раз на устройстве</small></div><input id="fbi" class="inp" style="width:100%;margin-top:10px" placeholder="https://...firebasedatabase.app"><button class="btn wide" onclick="setFB()">Подключить</button>`;
 if(!DB)return`<div class="emp"><div>🤝</div>Нет связи<small>Проверь интернет, игра попробует снова сама</small></div>`;
 const dn=Object.keys(S.dup).filter(n=>S.dup[n]>0).map(Number),mine=OF.filter(o=>o.from==ME&&o.status=="open"),oth=OF.filter(o=>o.from!=ME&&o.status=="open").sort((a,b)=>b.t-a.t).slice(0,30);
 let h=`<h2 style="margin-top:0">➕ Новое предложение</h2>`+(dn.length?`<p class="tip" style="margin:0 0 6px">Что отдаёшь (твои дубликаты):</p><div class="chips" id="chips">${dn.map(n=>`<button class="chip ${trg==n?"on":""}" onclick="trg=${n};render()">№${n}<small>×${S.dup[n]}</small></button>`).join("")}</div><div class="box"><div class="t"><b>Что хочешь получить</b><small>Номер карточки от 1 до 100</small></div><input class="inp" type="number" min="1" max="100" inputmode="numeric" value="${trw}" oninput="trw=this.value"></div><button class="btn wide" onclick="mkOffer()" style="margin-top:0">Предложить обмен</button>`:`<p class="tip">Нет дубликатов для обмена. Они появятся, когда выпадет карточка, которая у тебя уже есть.</p>`);
 h+=`<h2>📤 Мои предложения</h2>`+(mine.length?mine.map(o=>`<div class="box"><div class="t"><b>${cn(o.give)} → ${cn(o.want)}</b><small>Ждёт, пока кто-то согласится</small></div><button class="btn s" onclick="cnc('${o.id}')">Отменить</button></div>`).join(""):`<p class="tip">Пока нет</p>`);
 h+=`<h2>🌍 Предложения игроков</h2>`+(oth.length?oth.map(o=>`<div class="box"><div class="t"><b>${o.nm||"Игрок"}</b><small>Отдаёт ${cn(o.give)}${S.cards[o.give]?"":" 🆕"} · хочет ${cn(o.want)}</small></div><button class="btn g s" ${S.dup[o.want]>0?"":"disabled"} onclick="acc('${o.id}')">Обменять</button></div>`).join(""):`<p class="tip">Пока никто ничего не предлагает</p>`);
 return h}
async function mkOffer(){const g=+trg,w=+trw;if(!(S.dup[g]>0))return toast("Выбери свой дубликат");if(!(w>=1&&w<=100)||w==g)return toast("Укажи номер от 1 до 100");if(OF.filter(o=>o.from==ME&&o.status=="open").length>=5)return toast("Не больше 5 открытых предложений");
 if(!S.nick){const n=prompt("Как тебя зовут в обмене?");if(!n)return;S.nick=n.slice(0,16)}
 S.dup[g]--;if(!S.dup[g])delete S.dup[g];save();try{await api("offers","POST",{from:ME,nm:S.nick,give:g,want:w,status:"open",t:Date.now()});trg=null;toast("Предложение опубликовано")}catch(e){S.dup[g]=(S.dup[g]||0)+1;save();toast("Не получилось, попробуй ещё раз")}await pull();render()}
async function cnc(id){try{const d=await api("offers/"+id);if(d&&d.status=="open"&&d.from==ME){await api("offers/"+id,"DELETE");S.dup[d.give]=(S.dup[d.give]||0)+1;save()}}catch(e){toast("Не получилось")}await pull();render()}
async function acc(id){const o=OF.find(x=>x.id==id);if(!o||!(S.dup[o.want]>0))return;try{const d=await api("offers/"+id);if(!d||d.status!="open")return toast("Предложение уже недоступно");await api("offers/"+id,"PATCH",{status:"done",to:ME});S.dup[o.want]--;if(!S.dup[o.want])delete S.dup[o.want];const t=give(o.give);save();toast("Обмен готов! Получена №"+o.give+(t=="NEW"?" 🆕":""))}catch(e){toast("Не получилось, попробуй ещё раз")}await pull();render()}
setInterval(tick,400);render();setInterval(pull,6000);pull();
if(away)toast("С возвращением! Созрело: "+away+" 🌾");
</script></body></html>
