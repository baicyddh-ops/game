<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;backdrop-filter:blur(10px);background:var(--panel);border-bottom:1px solid var(--brd)}
h1{font-size:18px;margin:0}.money{font-weight:800;color:var(--gold);font-size:20px}
main{max-width:560px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(14px);border-top:1px solid var(--brd);z-index:6}

nav button b{display:block;font-size:20px}nav button.on{background:#7cfc9a30;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plot{aspect-ratio:1;border-radius:20px;border:2px dashed var(--brd);background:linear-gradient(160deg,#8b5a2b66,#4b2e1266);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;font-size:11px;color:var(--mut);text-align:center;line-height:1.25;transition:transform .1s}
.plot:active{transform:scale(.96)}
.plot.g{border-style:solid}
.plot.ripe{border:2px solid var(--gold);color:var(--text);animation:glow 1.2s infinite alternate}.plot.ripe .e{animation:bob .7s infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px var(--gc,#ffd54a88)}to{box-shadow:0 0 24px var(--gc,#ffd54acc)}}@keyframes bob{to{transform:translateY(-5px) scale(1.1)}}
.plot u{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:#0006;display:grid;place-items:center;text-decoration:none;font-size:13px;opacity:.45}.plot u.on{opacity:1;background:#7cfc9a66}
.bd{position:absolute;top:5px;left:5px;max-width:70%;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;background:var(--mc);color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}

.plot.mg0{background:linear-gradient(160deg,#6be67544,#2e5a2b88)}
.plot.mg1{background:linear-gradient(160deg,#ffd54a77,#8b5a2b99)}
.plot.mg2{background:linear-gradient(160deg,#6fe3ff66,#1d4d66cc)}
.plot.mg3{background:linear-gradient(160deg,#ff7ad977,#4aa8ff77)}
.plot.mg4{background:radial-gradient(circle at 50% 30%,#7b3fe4cc,#0b0820)}
.plot.mg1 .e{filter:sepia(1) saturate(3.5) brightness(1.15) drop-shadow(0 0 6px #ffd54a)}
.plot.mg2 .e{filter:hue-rotate(150deg) saturate(2) brightness(1.25) drop-shadow(0 0 7px #6fe3ff)}
.plot.mg3 .e{animation:hue 3s linear infinite}.plot.ripe.mg3 .e{animation:bob .7s infinite alternate,hue 3s linear infinite}
.plot.mg4 .e{filter:hue-rotate(250deg) saturate(2.5) drop-shadow(0 0 9px #b45cff)}
@keyframes hue{from{filter:hue-rotate(0) saturate(2.2) drop-shadow(0 0 6px #fff)}to{filter:hue-rotate(360deg) saturate(2.2) drop-shadow(0 0 6px #fff)}}
.plot.mg1::after,.plot.mg2::after,.plot.mg3::after,.plot.mg4::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 28%,#fff 0 1px,#0000 3px),radial-gradient(circle at 82% 36%,#fff 0 1px,#0000 3px),radial-gradient(circle at 70% 78%,#fff 0 1.5px,#0000 4px),radial-gradient(circle at 26% 72%,#fff 0 1px,#0000 3px);animation:tw 1.6s ease-in-out infinite alternate}
.plot.mg0 .e{filter:drop-shadow(0 0 5px #6be675)}
.bar{position:absolute;left:8px;right:8px;bottom:7px;height:5px;border-radius:4px;background:#0005}.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#7cfc9a,#d4ff6a)}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:700;font-size:14px;color:#10240f;background:linear-gradient(135deg,#7cfc9a,#d4ff6a)}.btn.g{background:linear-gradient(135deg,#ffd54a,#ff9f43)}.btn.s{padding:8px 10px;font-size:12px}.btn:disabled{opacity:.4}.wide{width:100%;margin-top:12px}.btn:active{transform:scale(.97)}
.r2g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.r2g .full{grid-column:1/-1;padding:14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:2px solid var(--brd);border-radius:14px;padding:6px 10px;background:var(--panel);color:var(--text);font-size:13px;white-space:nowrap}.chip.on{border-color:var(--gold);background:#ffd54a22}.chip.dim{opacity:.45}.chip small{margin-left:4px;font-size:11px;color:var(--mut)}
.chips.sd .chip{font-size:20px;padding:5px 10px;line-height:1.2;text-align:center}.chips.sd .chip small{display:block;margin:0}
.box{background:var(--panel);border:1px solid var(--brd);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.box .t{flex:1}.box small{color:var(--mut);display:block;margin-top:2px}.big{font-size:34px}.btns{display:flex;flex-direction:column;gap:5px}
h2{font-size:14px;margin:18px 2px 8px;color:var(--mut)}h2[class]{color:var(--a)}
.tip{color:var(--mut);font-size:12px;text-align:center;line-height:1.5}
.help{width:28px;height:28px;border-radius:50%;border:1px solid var(--brd);background:var(--panel);color:var(--text);font-weight:800;font-size:14px;padding:0}.hp{font-size:13px;line-height:1.5;margin:0 2px 6px}
.mkh{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;margin-bottom:12px;background:linear-gradient(135deg,#ffd54a33,#ff9f4322);border:1px solid #ffd54a66}.mkh .t{flex:1}.mkh small{color:var(--mut);display:block;margin-top:2px}
.mk{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 10px 12px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 30%,transparent),var(--panel));border:2px solid color-mix(in srgb,var(--mc) 65%,transparent)}
.it .em{font-size:50px;line-height:1;filter:drop-shadow(0 4px 6px #0005)}.it b{font-size:15px}
.it .cnt{position:absolute;top:8px;left:8px;background:#0007;color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:10px}.it .fz2{position:absolute;top:7px;right:8px;font-size:16px}
.it .bd2{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;color:#111}
.it .pr{color:var(--gold);font-weight:800;font-size:16px}.it .pr small{color:var(--mut);font-size:11px;font-weight:500}.it .btn{width:100%}
.emp{text-align:center;padding:40px 16px;border-radius:20px;border:2px dashed var(--brd);color:var(--mut);font-weight:700}.emp div{font-size:56px;opacity:.6}.emp small{display:block;margin-top:6px;font-weight:400;font-size:12px}
nav button{position:relative}.nb{position:absolute;top:2px;right:16%;background:#ff4d6d;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px}
.mut{display:grid;gap:6px}.mi{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--mc);border-radius:12px;padding:6px 10px;font-size:13px}.mi small{margin-left:auto;color:var(--mut);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.r0{--a:#8f9cab;--b:#e3e8ed;--p:#f3f5f7;--a1:#d6dee6;--a2:#7b8998}.r1{--a:#2fbf5b;--b:#c4f5d2;--p:#eefbe9;--a1:#a6f2b9;--a2:#238a45}.r2{--a:#2f8cf5;--b:#c6e2ff;--p:#eaf4ff;--a1:#93ccff;--a2:#1f5fc0}.r3{--a:#9b4dff;--b:#e6cdff;--p:#f6ecff;--a1:#d9adff;--a2:#5f27c2}.r4{--a:#f5a300;--b:#ffe9a0;--p:#fff6d9;--a1:#ffe680;--a2:#d96f00}.r5{--a:#ff3d6e;--b:#ffc4d3;--p:#fff0f4;--a1:#ff94b0;--a2:#a0003c}.r6{--a:#e6b800;--b:#fff7cc;--p:#fffdf0;--a1:#fff;--a2:#e0a100}
.card{container-type:inline-size;position:relative;aspect-ratio:5/7;border-radius:7%/5%;background:linear-gradient(135deg,var(--b),var(--a) 40%,var(--b) 65%,var(--a));box-shadow:0 5px 16px #0006,0 0 20px color-mix(in srgb,var(--a) 50%,transparent);cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.97)}
.in{position:absolute;inset:2.6% 3.6%;border-radius:5cqw;background:var(--p);color:#1c1c24;display:flex;flex-direction:column;gap:2cqw;padding:3.5cqw;overflow:hidden}
.tp{display:flex;align-items:center;justify-content:space-between;gap:2cqw;font-weight:900;min-height:8cqw}.tp b{font-size:6.6cqw;white-space:nowrap;line-height:1.1}.tp b.sm{font-size:5.4cqw}.tp b.xs{font-size:4.3cqw}
.lvb{flex:0 0 auto;font-size:3.6cqw;font-weight:800;color:#fff;background:var(--a2);border-radius:10cqw;padding:.8cqw 2.4cqw}
.art{flex:1;min-height:0;position:relative;border-radius:3cqw;border:1cqw solid var(--a);box-shadow:inset 0 0 6cqw #0004;background:radial-gradient(circle at 50% 35%,var(--a1),var(--a2));overflow:hidden;display:grid;place-items:center}.art>*{grid-area:1/1}
.rays{width:300%;aspect-ratio:1;background:repeating-conic-gradient(#ffffff30 0 7deg,#0000 7deg 18deg);animation:sp 24s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.num{font:900 42cqw/1 Impact,"Arial Black",system-ui,sans-serif;color:#fff;-webkit-text-stroke:1.2cqw var(--a2);paint-order:stroke fill;text-shadow:0 2cqw 0 var(--a2),0 4cqw 5cqw #0006;z-index:1}.num.t{font-size:32cqw}
.r2 .art::after,.r3 .art::after,.r4 .art::after,.r5 .art::after,.r6 .art::after{content:"";z-index:2;pointer-events:none;grid-area:1/1;background:radial-gradient(circle at 18% 22%,#fff 0 .8cqw,#0000 1.8cqw),radial-gradient(circle at 82% 30%,#fff 0 .6cqw,#0000 1.5cqw),radial-gradient(circle at 70% 80%,#fff 0 .9cqw,#0000 2cqw),radial-gradient(circle at 24% 76%,#fff 0 .6cqw,#0000 1.5cqw);animation:tw 1.8s ease-in-out infinite alternate}@keyframes tw{from{opacity:.2}to{opacity:1}}
.st{font-size:4cqw;font-weight:700;text-align:center;color:var(--a2);background:linear-gradient(90deg,#0000,var(--b),#0000);padding:.6cqw}
.mv{display:flex;align-items:center;gap:2.5cqw;border-top:.4cqw solid #0002;padding-top:2cqw}.mv .o{flex:0 0 8cqw;height:8cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--a));display:grid;place-items:center;font-size:4.4cqw}
.mv div{flex:1;font-size:5cqw;font-weight:800;line-height:1.1}.mv small{display:block;font-size:3.6cqw;font-weight:500;color:#555}.mv strong{font-size:6.6cqw;font-weight:900}
.nm{font:italic 800 9cqw/1.1 Georgia,"Times New Roman",serif;text-align:center;color:var(--a2);letter-spacing:.3cqw;padding:1.2cqw 0;background:linear-gradient(90deg,#0000,var(--b),#0000);white-space:nowrap}.nm.sm{font-size:7.5cqw}.nm.xs{font-size:6.4cqw}.lk .nm{color:#556070;background:none}
.fc{font-size:3.8cqw;font-style:italic;color:#555;text-align:center}
.ft{display:flex;justify-content:space-between;font-size:3.8cqw;font-weight:700;color:#555}.ft .lv{color:#e6a700}
.cards .rays,.cards .hl,.cards .art::after{animation:none}
.lk{filter:saturate(.15) brightness(.8)}.lk .in{background:#2a3340;color:#8b97a6}.lk .num{color:#556070;text-shadow:none;-webkit-text-stroke:0}.lk .art{background:#1a212b;box-shadow:none}.lk .rays{display:none}
.new{position:absolute;top:-8px;right:-4px;z-index:3;color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px}
.ov{position:fixed;inset:0;z-index:20;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}.ov.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--brd);border-radius:22px;padding:16px;color:var(--text)}
.pk{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 6px}.pk .card{flex:0 0 68%;scroll-snap-align:center;opacity:0;animation:pop .6s forwards}

.zoom .card{width:min(100%,300px);margin:8px auto;display:block}

.in{inset:2.2% 3%;padding:3cqw;gap:0;background:radial-gradient(circle at 50% 42%,var(--a1),var(--a2) 88%)}

/* Hay Day стиль */
:root:root:root{--bg1:#9ad8ff;--bg2:#6cc35a;--panel:#fff3d6;--text:#4a2e12;--mut:#7a5a35;--gold:#ffe27a;--brd:#8a5a2b55;color-scheme:light}
body{background:linear-gradient(#8fd3ff 0,#c9ecff 130px,#86cf63 130px,#4fa83a 100%) fixed}body::before{background:#8fd3ff}
header{background:linear-gradient(#c8955a,#a8743c);border-bottom:4px solid #6e4520;color:#fff;backdrop-filter:none}h1{color:#fff;text-shadow:0 2px 0 #5e3b17}
nav{background:linear-gradient(#a8743c,#7a4f24);border-top:4px solid #5e3b17;backdrop-filter:none}nav button{color:#f5dcb4}nav button.on{background:#ffd54a;color:#4a2e12}

.chip{border:2px solid #b86a1a;background:#ffe9b8;color:#4a2e12;font-weight:700}.chip.on{background:#ffd54a}
.plot{background:linear-gradient(160deg,#a8743c,#6e4520);border:3px solid #4a2e12;color:#ffe9b8}
.sheet{background:#fff3d6;color:#4a2e12}

const acH=()=>{const n=Object.keys(S.ach).length;return`<h2>🏆 Достижения ${n}/${AC.length}</h2><div class="lvb"><div><i style="width:${Math.round(n/AC.length*100)}%"></i></div><small>${n}/${AC.length}</small></div>`+AC.map((a,i)=>S.ach[i]?`<div class="box ad"><div class="big">${a[0]}</div><div class="t"><b>${a[1]}</b><small>${a[2]}</small></div><span class="dn2">✅<small>Выполнено</small></span></div>`:`<div class="box al"><div class="big">🔒</div><div class="t"><b>${a[1]}</b><small>${a[2]}</small></div></div>`).join("")};
const pgNeed=()=>Math.round(1e6*Math.pow(4,S.pg|0));
function pgH(){const n=pgNeed(),ok=S.m>=n;return`<h2>♻️ Перерождение</h2><div class="box"><div class="big">♻️</div><div class="t"><b>Перерождений: ${S.pg|0}</b><small>Сейчас: рост растений +${10*(S.pg|0)}%, опыт +${20*(S.pg|0)}%. Сбросится всё: деньги, опыт и уровень, семена, грядки, улучшения, квесты, достижения и склад. Останутся только карточки (с дубликатами и обменами) и данные чата. Каждое перерождение навсегда даёт +10% к скорости роста растений и +20% к опыту.</small></div></div><button class="btn g wide" ${ok?"":"disabled"} onclick="rebirth()">${ok?"Переродиться":"Нужно 💰"+fmt(n)}</button>`}
function rebirth(){if(S.m<pgNeed()||!confirm("Сбросить ВСЁ (деньги, уровень, квесты, достижения, улучшения, урожай) ради бонуса навсегда: +10% к скорости роста и +20% к опыту?\nОстанутся только карточки и данные чата."))return;
 const keep=["cards","dup","nw","tr","esc","code","nick","uid","dms","seen","clr","ntf","rs","fp","v","mv","achv","ut","ct"],kp={},pg=(S.pg|0)+1;keep.forEach(k=>{if(S[k]!==undefined)kp[k]=S[k]});
 S=Object.assign(S0(),kp);S.pg=pg;S.xp=0;S.tot=0;S.ach={};S.qd={};S.mc={};S.mk={t:Date.now(),x:PL.map(()=>1)};ensureSel();beep(300,.6);save();render()}
function upH(){const u=Math.min(S.ut|0,2),tb=[["⬆️","Улучшения"],["🏆","Награды"],["♻️","Перерождение"]].map((x,i)=>`<button class="chip ${u==i?"on":""}" onclick="S.ut=${i};render()"><b>${x[0]}</b>${x[1]}</button>`).join("");return`<div class="chips tb">${tb}</div>`+[()=>upH0(),acH,pgH][u]()}
function xtick(){const now=Date.now();fixC();
 if(S.ev&&S.ev.e<now){S.ev=null;S.evn=now+24e4+Math.random()*24e4;EVR=1}
 else if(!S.ev&&now>=(S.evn||(S.evn=now+6e4))){const k=Math.random()*EVK.length|0;S.ev={k,p:Math.random()*20|0,e:now+3e5};EVR=1;toast(EVK[k][0]+"!");beep(740,.3)}
 AC.forEach((a,i)=>{if(!S.ach[i]&&a[3]()){S.ach[i]=1;const r=Math.max(50,Math.round(S.m*.01));S.m+=r;fxPush(acFx(a,r),2600);beep(660,.4);setTimeout(()=>beep(990,.4),180);save()}});
 if(EVR&&!$("ov").classList.contains("on")){EVR=0;if(tab==0||tab==2||tab==4)render()}}
